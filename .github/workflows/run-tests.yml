name: CI Tests

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref (keeps queue short on PR pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only need to read the repo.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

  build-test:
    name: Test Run (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"] # update also in setup.py, pyproject.toml, readme.md, c4dynamics_setup.ipynb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          # Install c4dynamics itself (editable) with the vision extra, so CI
          # exercises the actual packaged import, not just the source tree.
          pip install -e ".[vision]" coverage
          # open3d is optional (only used by rigidbody.animate) and lags new
          # Python releases; don't fail the run when no wheel is available.
          pip install open3d || echo "open3d unavailable for Python ${{ matrix.python-version }}; animate tests will be skipped"

      - name: List installed packages
        run: pip list

      - name: Run unittests with coverage
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py"
          coverage xml

      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
