name: CI Tests

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: Test Run (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"] # update also in setup.py, pyprogect.yaml, readme.md, c4dynamics_setup.ipynb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-vision.txt
          # open3d is optional (only used by rigidbody.animate) and lags new
          # Python releases; don't fail the run when no wheel is available.
          pip install open3d || echo "open3d unavailable for Python ${{ matrix.python-version }}; animate tests will be skipped"

      - name: List installed packages
        run: pip list

      - name: Run unittests with coverage
        run: |
          pip install coverage
          coverage run -m unittest discover -s tests -p "test_*.py"
          coverage xml 

      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' &&  matrix.python-version == '3.10'}}
        uses: codecov/codecov-action@v7

